# Publishes web/site (the web builder's front end) to GitHub Pages.
# One-time: repo Settings > Pages > Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
    paths: ['web/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Browsers cache Pages files for 10 minutes; a per-commit query makes them fetch new code at once.
      - run: sed -i -E "s/(config\.js|app\.js|style\.css)\"/\1?v=${GITHUB_SHA::8}\"/g" web/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - id: deployment
        uses: actions/deploy-pages@v4
